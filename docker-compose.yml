services:
  nebula-app:
    container_name: nebula-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTGRES_PRISMA_URL: ${POSTGRES_PRISMA_URL}
        POSTGRES_URL_NON_POOLING: ${POSTGRES_URL_NON_POOLING}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_TICKETS_URL: ${NEXT_PUBLIC_TICKETS_URL}
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/public/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_PRISMA_URL=${POSTGRES_PRISMA_URL}
      - POSTGRES_URL_NON_POOLING=${POSTGRES_URL_NON_POOLING}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_TICKETS_URL=${NEXT_PUBLIC_TICKETS_URL}
      - AUTH_TRUST_HOST=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nebula-network

  db:
    container_name: nebula-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula_password
      POSTGRES_DB: nebula_assets
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula_assets"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nebula-network

networks:
  nebula-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
